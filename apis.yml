aid: sonatype
name: Sonatype
description: >-
  Sonatype provides software supply chain management solutions including Sonatype Lifecycle (IQ Server), Sonatype
  Repository Firewall, SBOM Manager, and Nexus Repository. The Lifecycle Public REST API provides 188 endpoints for
  application portfolio management, policy enforcement, vulnerability reporting, component analysis, SBOM generation,
  source control integration, and software composition analysis across the SDLC.
type: Index
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
  label: Freemium · Self-serve signup
  confidence: high
  source:
  - plans
  - authentication
  generated: '2026-07-22'
  method: derived
position: Consumer
access: 3rd-Party
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/sonatype.png
tags:
