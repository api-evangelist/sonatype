aid: sonatype
name: Sonatype
description: Sonatype provides software supply chain management solutions including Sonatype Lifecycle (IQ Server), Sonatype
  Repository Firewall, SBOM Manager, and Nexus Repository. The Lifecycle Public REST API provides 188 endpoints for application
  portfolio management, policy enforcement, vulnerability reporting, component analysis, SBOM generation, source control integration,
  and software composition analysis across the SDLC.
type: Index
position: Consumer
access: 3rd-Party
