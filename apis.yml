apis:
- aid: sonatype:sonatype-lifecycle-api
  name: Sonatype Lifecycle API
  description: The Sonatype Lifecycle Public REST API (v1.201.0) provides 188 endpoints for managing applications, organizations,
    policies, policy violations, waivers, vulnerability analysis, SBOM generation (SPDX, CycloneDX), scan management, component
    search, reports, source control integration, users, roles, and user tokens. Used by DevSecOps teams to automate software
    supply chain security and compliance workflows.
  humanURL: https://help.sonatype.com/en/iq-api-reference.html
  baseURL: https://{iq-server-host}/
