- aid: sonatype:sonatype-claim-components-api
  name: Sonatype Claim Components API
  description: >-
    Use this REST API to manage components that are developed in-house and are not open-source.


    Claiming the component stores the identity information for the component hash and avoids triggering
    the Component-Unknown policy.


    Components will have a match state as `Exact` and Identification Source as `Manual`,

    for subsequent scans or evaluations.
