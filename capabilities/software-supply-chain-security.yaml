naftiko: 1.0.0-alpha2
info:
  label: Sonatype Software Supply Chain Security
  description: Workflow capability for software supply chain security using Sonatype Lifecycle. Covers application portfolio
    management, policy violation monitoring, vulnerability intelligence, component analysis, SBOM generation, and waiver management.
    Used by DevSecOps engineers, security teams, and compliance officers.
  tags:
  - Sonatype
  - Software Supply Chain
  - Security
  - Vulnerability Management
  - SBOM
  - DevSecOps
  - Policy
  - Compliance
  created: '2026-05-02'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    SONATYPE_USERNAME: SONATYPE_USERNAME
    SONATYPE_PASSWORD: SONATYPE_PASSWORD
capability:
  consumes:
  - type: http
    namespace: sonatype-lifecycle
    baseUri: https://{iq-server-host}
    description: Sonatype Lifecycle Public REST API v1.201.0
    authentication:
      type: basic
      username: '{{SONATYPE_USERNAME}}'
      password: '{{SONATYPE_PASSWORD}}'
    resources:
    - name: applications
      path: /api/v2/applications
      description: Manage applications in the Sonatype Lifecycle portfolio
      operations:
      - name: list-applications
        method: GET
        description: List all applications
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-application
        method: POST
        description: Create a new application
        body:
          type: json
          data:
            publicId: '{{tools.publicId}}'
            name: '{{tools.name}}'
            organizationId: '{{tools.organizationId}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-application
        method: GET
        description: Get application by ID
        inputParameters:
        - name: applicationId
          in: path
          type: string
          required: true
          description: Application ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: delete-application
        method: DELETE
        description: Delete an application
        inputParameters:
        - name: applicationId
          in: path
          type: string
          required: true
          description: Application ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: policy-violations
      path: /api/v2/policyViolations
      description: Query and manage policy violations
      operations:
      - name: list-policy-violations
        method: GET
        description: List policy violations for an application report
        inputParameters:
        - name: applicationId
          in: query
          type: string
          required: false
          description: Application ID filter
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: policy-waivers
      path: /api/v2/policyWaivers
      description: Manage policy waivers for violations
      operations:
      - name: list-waivers
        method: GET
        description: List policy waivers for an owner
        inputParameters:
        - name: ownerType
          in: path
          type: string
          required: true
          description: Owner type (application|organization|repository_manager)
        - name: ownerId
          in: path
          type: string
          required: true
          description: Internal owner ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: component-search
      path: /api/v2/search/component
      description: Search for components and vulnerabilities
      operations:
      - name: search-component
        method: GET
        description: Search for a component
        inputParameters:
        - name: hash
          in: query
          type: string
          required: false
          description: Component hash
        - name: packageUrl
          in: query
          type: string
          required: false
          description: Package URL (PURL)
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: vulnerabilities
      path: /api/v2/vulnerabilities
      description: Vulnerability intelligence and lookups
      operations:
      - name: get-vulnerability
        method: GET
        description: Get vulnerability by reference ID
        inputParameters:
        - name: refId
          in: path
          type: string
          required: true
          description: Vulnerability reference ID (CVE, SONATYPE, etc)
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: reports
      path: /api/v2/reports/applications
      description: Application scan reports and metrics
      operations:
      - name: list-reports
        method: GET
        description: List reports for all applications
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-application-reports
        method: GET
        description: Get reports for a specific application
        inputParameters:
        - name: applicationId
          in: path
          type: string
          required: true
          description: Application ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: spdx
      path: /api/v2/spdx
      description: Generate SPDX Software Bill of Materials
      operations:
      - name: get-spdx-report
        method: GET
        description: Generate SPDX SBOM for a scan report
        inputParameters:
        - name: applicationId
          in: path
          type: string
          required: true
          description: Application ID
        - name: scanId
          in: path
          type: string
          required: true
          description: Scan ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: users
      path: /api/v2/users
      description: User account management
      operations:
      - name: list-users
        method: GET
        description: List users
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-user
        method: POST
        description: Create a new user
        body:
          type: json
          data:
            username: '{{tools.username}}'
            password: '{{tools.password}}'
            firstName: '{{tools.firstName}}'
            lastName: '{{tools.lastName}}'
            email: '{{tools.email}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: sonatype-supply-chain-api
    description: Unified REST API for software supply chain security with Sonatype Lifecycle.
    resources:
    - path: /v1/applications
      name: applications
      description: Application portfolio management
      operations:
      - method: GET
        name: list-applications
        description: List all applications in portfolio
        call: sonatype-lifecycle.list-applications
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: create-application
        description: Register a new application
        call: sonatype-lifecycle.create-application
        with:
          publicId: rest.publicId
          name: rest.name
          organizationId: rest.organizationId
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: get-application
        description: Get application details by ID
        call: sonatype-lifecycle.get-application
        with:
          applicationId: rest.applicationId
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: delete-application
        description: Remove an application from portfolio
        call: sonatype-lifecycle.delete-application
        with:
          applicationId: rest.applicationId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/violations
      name: policy-violations
      description: Policy violation monitoring
      operations:
      - method: GET
        name: list-violations
        description: List policy violations
        call: sonatype-lifecycle.list-policy-violations
        with:
          applicationId: rest.applicationId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/waivers
      name: policy-waivers
      description: Policy waiver management
      operations:
      - method: GET
        name: list-waivers
        description: List policy waivers
        call: sonatype-lifecycle.list-waivers
        with:
          ownerType: rest.ownerType
          ownerId: rest.ownerId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/search
      name: component-search
      description: Component and vulnerability search
      operations:
      - method: GET
        name: search-component
        description: Search for a component by hash or PURL
        call: sonatype-lifecycle.search-component
        with:
          hash: rest.hash
          packageUrl: rest.packageUrl
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/vulnerabilities
      name: vulnerabilities
      description: Vulnerability intelligence
      operations:
      - method: GET
        name: get-vulnerability
        description: Get vulnerability details by CVE or reference ID
        call: sonatype-lifecycle.get-vulnerability
        with:
          refId: rest.refId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/reports
      name: reports
      description: Scan reports and compliance metrics
      operations:
      - method: GET
        name: list-reports
        description: List reports for all applications
        call: sonatype-lifecycle.list-reports
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: get-application-reports
        description: Get reports for a specific application
        call: sonatype-lifecycle.get-application-reports
        with:
          applicationId: rest.applicationId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/sbom
      name: sbom
      description: Software Bill of Materials generation
      operations:
      - method: GET
        name: get-spdx-report
        description: Generate SPDX SBOM for a scan
        call: sonatype-lifecycle.get-spdx-report
        with:
          applicationId: rest.applicationId
          scanId: rest.scanId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9080
    namespace: sonatype-supply-chain-mcp
    transport: http
    description: MCP server for AI-assisted software supply chain security with Sonatype Lifecycle.
    tools:
    - name: list-applications
      description: List all applications in the Sonatype Lifecycle portfolio
      hints:
        readOnly: true
        idempotent: true
      call: sonatype-lifecycle.list-applications
      outputParameters:
      - type: object
        mapping: $.
    - name: create-application
      description: Register a new application in Sonatype Lifecycle
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: sonatype-lifecycle.create-application
      with:
        publicId: tools.publicId
        name: tools.name
        organizationId: tools.organizationId
      outputParameters:
      - type: object
        mapping: $.
    - name: get-application
      description: Get application details from Sonatype Lifecycle
      hints:
        readOnly: true
        idempotent: true
      call: sonatype-lifecycle.get-application
      with:
        applicationId: tools.applicationId
      outputParameters:
      - type: object
        mapping: $.
    - name: list-policy-violations
      description: List policy violations for an application
      hints:
        readOnly: true
        idempotent: true
      call: sonatype-lifecycle.list-policy-violations
      with:
        applicationId: tools.applicationId
      outputParameters:
      - type: object
        mapping: $.
    - name: list-policy-waivers
      description: List policy waivers for an owner
      hints:
        readOnly: true
        idempotent: true
      call: sonatype-lifecycle.list-waivers
      with:
        ownerType: tools.ownerType
        ownerId: tools.ownerId
      outputParameters:
      - type: object
        mapping: $.
    - name: search-component
      description: Search for a component by hash or PURL to get vulnerability and policy data
      hints:
        readOnly: true
        idempotent: true
      call: sonatype-lifecycle.search-component
      with:
        hash: tools.hash
        packageUrl: tools.packageUrl
      outputParameters:
      - type: object
        mapping: $.
    - name: get-vulnerability
      description: Get detailed vulnerability information by CVE or Sonatype reference ID
      hints:
        readOnly: true
        idempotent: true
      call: sonatype-lifecycle.get-vulnerability
      with:
        refId: tools.refId
      outputParameters:
      - type: object
        mapping: $.
    - name: list-application-reports
      description: List scan reports for a specific application
      hints:
        readOnly: true
        idempotent: true
      call: sonatype-lifecycle.get-application-reports
      with:
        applicationId: tools.applicationId
      outputParameters:
      - type: object
        mapping: $.
    - name: generate-spdx-sbom
      description: Generate an SPDX Software Bill of Materials for an application scan
      hints:
        readOnly: true
        idempotent: true
      call: sonatype-lifecycle.get-spdx-report
      with:
        applicationId: tools.applicationId
        scanId: tools.scanId
      outputParameters:
      - type: object
        mapping: $.
