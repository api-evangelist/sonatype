naftiko: 1.0.0-alpha2
info:
  label: Sonatype Lifecycle Public REST API — Policies
  description: 'Sonatype Lifecycle Public REST API — Policies. 1 operations. Lead operation: Policies. Self-contained Naftiko
    capability covering one Sonatype business surface.'
  tags:
  - Sonatype
  - Policies
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SONATYPE_API_KEY: SONATYPE_API_KEY
capability:
  consumes:
  - type: http
    namespace: lifecycle-policies
    baseUri: ''
    description: Sonatype Lifecycle Public REST API — Policies business capability. Self-contained, no shared references.
    resources:
    - name: api-v2-policies
      path: /api/v2/policies
      operations:
      - name: getpolicies
        method: GET
        description: Use this method to retrieve all existing policies.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.SONATYPE_API_KEY}}'
  exposes:
  - type: rest
    namespace: lifecycle-policies-rest
    port: 8080
    description: REST adapter for Sonatype Lifecycle Public REST API — Policies. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/api/v2/policies
      name: api-v2-policies
      description: REST surface for api-v2-policies.
      operations:
      - method: GET
        name: getpolicies
        description: Use this method to retrieve all existing policies.
        call: lifecycle-policies.getpolicies
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: lifecycle-policies-mcp
    port: 9090
    transport: http
    description: MCP adapter for Sonatype Lifecycle Public REST API — Policies. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: use-this-method-retrieve-all
      description: Use this method to retrieve all existing policies.
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: lifecycle-policies.getpolicies
      outputParameters:
      - type: object
        mapping: $.
