naftiko: 1.0.0-alpha2
info:
  label: Sonatype Lifecycle Public REST API — Composite Source Control Validator
  description: 'Sonatype Lifecycle Public REST API — Composite Source Control Validator. 1 operations. Lead operation: Composite
    Source Control Validator. Self-contained Naftiko capability covering one Sonatype business surface.'
  tags:
  - Sonatype
  - Composite Source Control Validator
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SONATYPE_API_KEY: SONATYPE_API_KEY
capability:
  consumes:
  - type: http
    namespace: lifecycle-composite-source-control-validator
    baseUri: ''
    description: Sonatype Lifecycle Public REST API — Composite Source Control Validator business capability. Self-contained,
      no shared references.
    resources:
    - name: api-v2-compositeSourceControlConfigValidator-application-applicationId
      path: /api/v2/compositeSourceControlConfigValidator/application/{applicationId}
      operations:
      - name: validatesourcecontrolconfig
        method: GET
        description: Use this method to validate the composite source control configuration.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: applicationId
          in: path
          type: string
          description: Enter the applicationId for which you want to validate the composite source control configuration.
          required: true
    authentication:
      type: bearer
      token: '{{env.SONATYPE_API_KEY}}'
  exposes:
  - type: rest
    namespace: lifecycle-composite-source-control-validator-rest
    port: 8080
    description: REST adapter for Sonatype Lifecycle Public REST API — Composite Source Control Validator. One Spectral-compliant
      resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/api/v2/compositesourcecontrolconfigvalidator/application/{applicationid}
      name: api-v2-compositesourcecontrolconfigvalidator-application-applicationid
      description: REST surface for api-v2-compositeSourceControlConfigValidator-application-applicationId.
      operations:
      - method: GET
        name: validatesourcecontrolconfig
        description: Use this method to validate the composite source control configuration.
        call: lifecycle-composite-source-control-validator.validatesourcecontrolconfig
        with:
          applicationId: rest.applicationId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: lifecycle-composite-source-control-validator-mcp
    port: 9090
    transport: http
    description: MCP adapter for Sonatype Lifecycle Public REST API — Composite Source Control Validator. One tool per consumed
      operation, routed inline through this capability's consumes block.
    tools:
    - name: use-this-method-validate-composite
      description: Use this method to validate the composite source control configuration.
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: lifecycle-composite-source-control-validator.validatesourcecontrolconfig
      with:
        applicationId: tools.applicationId
      outputParameters:
      - type: object
        mapping: $.
