openapi: 3.2.0
info:
  title: Sonatype Lifecycle Public REST Policy Waiver Reasons API
  version: 1.201.0-02
  description: Use this rest API to fetch available policy waiver reasons
security:
- BasicAuth: []
  BearerAuth: []
tags:
- description: Use this rest API to fetch available policy waiver reasons
  name: Policy Waiver Reasons
paths:
  /api/v2/policyWaiverReasons:
    get:
      description: 'Use this method to retrieve all policy waiver reasons.


        Permissions required: None'
      operationId: getPolicyWaiverReasons
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ApiPolicyWaiverReasonDTO'
                type: array
          description: Successfully retrieved all policy waiver reasons.
      tags:
      - Policy Waiver Reasons
      summary: Get policy waiver reasons
      x-summary-source: derived
components:
  schemas:
    ApiPolicyWaiverReasonDTO:
      properties:
        id:
          type: string
        reasonText:
          type: string
        type:
          type: string
      type: object
  securitySchemes:
    BasicAuth:
      scheme: basic
      type: http
    BearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
