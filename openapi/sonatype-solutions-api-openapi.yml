openapi: 3.2.0
info:
  title: Sonatype Solutions API
  version: '1.0'
  description: 'Operations tagged Solutions across 2 of this provider''s published API definitions: sonatype-lifecycle-openapi.yml, sonatype-iq-openapi.yml. Each path carries the servers of the definition it was published in.'
security:
- BasicAuth: []
  BearerAuth: []
tags:
- name: Solutions
paths:
  /api/v2/solutions/licensed:
    get:
      description: 'Retrieves a list of licensed solutions. The base URL must be set to get results unless relative URLs are allowed.


        Permissions required: None'
      operationId: getLicensedSolutions
      parameters:
      - description: Whether or not relative URLs should be allowed.
        in: query
        name: allowRelativeUrls
        schema:
          default: false
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ApiLicensedSolutionDTO'
                type: array
          description: Successfully retrieved the list of licensed solutions.
      tags:
      - Solutions
      summary: Get licensed solutions
      x-summary-source: derived
components:
  schemas:
    ApiLicensedSolutionDTO:
      properties:
        id:
          type: string
        url:
          type: string
      type: object
  securitySchemes:
    BasicAuth:
      scheme: basic
      type: http
    BearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
x-refined-from:
- sonatype-lifecycle-openapi.yml
- sonatype-iq-openapi.yml
